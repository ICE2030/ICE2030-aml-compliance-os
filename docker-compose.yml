version: "3.9"

services:
  backend:
    build:
      context: ./aml-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - db-data:/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./aml_compliance.db
      - SECRET_KEY=${SECRET_KEY:-aml-compliance-os-dev-secret-key-change-in-production}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@aml-os.sa}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db-data:
